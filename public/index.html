<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Auto-Trading Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kantumruy Pro', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    
    <header class="border-b border-slate-900 bg-slate-900/50 backdrop-blur py-4 px-6 text-center">
        <h1 class="text-xl font-bold text-emerald-400">🏆 COOP SMART AUTO-TRADING COOPERATIVE</h1>
    </header>

    <main class="max-w-4xl mx-auto p-6 space-y-6">
        
        <!-- ផ្ទាំងចុះឈ្មោះសមាជិកថ្មី (Register Form) -->
        <div class="bg-slate-900/60 border border-slate-900 p-6 rounded-2xl shadow-xl">
            <h2 class="text-lg font-semibold text-slate-300 mb-4 border-b border-slate-800 pb-2">📝 ចុះឈ្មោះគណនីត្រេដថ្មី (សម្រាប់សមាជិកម្នាក់ៗ)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">ឈ្មោះសមាជិក (Username)</label>
                    <input type="text" id="username" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-300 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">លេខគណនី Exness MT5 (Login ID)</label>
                    <input type="text" id="accId" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-300 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">លេខសម្ងាត់ Exness (Trading Password)</label>
                    <input type="password" id="password_mt5" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-300 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">ម៉ាស៊ីនបម្រើ (Broker Server)</label>
                    <input type="text" id="server" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-300 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Lot Size របស់ខ្លួនឯង</label>
                    <input type="number" id="lotSize" value="0.01" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-300 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">កាត់ចំណេញ TP ($)</label>
                        <input type="number" id="tp_usd" value="0.65" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-emerald-400 font-bold focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">កាត់ខាត SL ($)</label>
                        <input type="number" id="sl_usd" value="5.00" step="0.1" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-rose-400 font-bold focus:outline-none">
                    </div>
                </div>
            </div>
            <button onclick="registerAccount()" class="w-full mt-6 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition-all">🚀 ចុះឈ្មោះ និងតភ្ជាប់ទៅ Cloud</button>
        </div>

        <!-- ផ្ទាំងពិនិត្យសមតុល្យលុយសមាជិក (Check Balance Panel) -->
        <div class="bg-slate-900/60 border border-slate-900 p-6 rounded-2xl shadow-xl">
            <h2 class="text-lg font-semibold text-slate-300 mb-4 border-b border-slate-800 pb-2">📊 ពិនិត្យសមតុល្យគណនីផ្ទាល់ខ្លួន</h2>
            <div class="flex gap-4">
                <input type="text" id="checkUser" placeholder="វាយឈ្មោះសមាជិករបស់អ្នក..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-300 focus:outline-none">
                <button onclick="checkStatus()" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-6 py-2 rounded-xl font-semibold">ស្កែនរក</button>
            </div>
            <div class="grid grid-cols-2 gap-4 mt-6">
                <div class="p-4 bg-slate-950 border border-slate-900 rounded-xl">
                    <p class="text-xs text-slate-500">សមតុល្យ (Balance)</p>
                    <h3 id="balVal" class="text-2xl font-bold text-slate-100">$0.00</h3>
                </div>
                <div class="p-4 bg-slate-950 border border-slate-900 rounded-xl">
                    <p class="text-xs text-slate-500">ទ្រព្យសកម្ម (Equity)</p>
                    <h3 id="eqVal" class="text-2xl font-bold text-emerald-400">$0.00</h3>
                </div>
            </div>
        </div>

    </main>

    <script>
        function registerAccount() {
            const username = document.getElementById('username').value;
            const accId = document.getElementById('accId').value;
            const password_mt5 = document.getElementById('password_mt5').value;
            const server = document.getElementById('server').value;
            const lotSize = parseFloat(document.getElementById('lotSize').value);
            const tp_usd = parseFloat(document.getElementById('tp_usd').value);
            const sl_usd = parseFloat(document.getElementById('sl_usd').value);

            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, accId, password_mt5, server, lotSize, tp_usd, sl_usd })
            })
            .then(res => res.text())
            .then(data => alert(data))
            .catch(err => alert("ការចុះឈ្មោះបរាជ័យ"));
        }

        function checkStatus() {
            const user = document.getElementById('checkUser').value;
            fetch(`/api/status/${user}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('balVal').innerText = `$${parseFloat(data.balance).toFixed(2)}`;
                document.getElementById('eqVal').innerText = `$${parseFloat(data.equity).toFixed(2)}`;
            });
        }
    </script>
</body>
</html>
