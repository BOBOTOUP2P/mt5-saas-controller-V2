<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Auto-Trading Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kantumruy Pro', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    
    <header class="border-b border-slate-900 bg-slate-900/50 backdrop-blur py-4 px-6 text-center">
        <h1 class="text-xl font-bold text-emerald-400">🏆 COOP SMART AUTO-TRADING SYSTEM</h1>
    </header>

    <main class="max-w-4xl mx-auto p-6 space-y-6">
        
        <!-- ប្រអប់បង្ហាញភ្លើងសញ្ញាតភ្ជាប់ទាំង ៣ (Triple Status Lights) -->
        <div class="bg-slate-900/60 border border-slate-900 p-6 rounded-2xl shadow-xl">
            <h2 class="text-md font-semibold text-slate-300 mb-4 border-b border-slate-800 pb-2">🚦 ស្ថានភាពស្ពានតភ្ជាប់ប្រព័ន្ធ (Connection Status)</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="flex items-center gap-3 p-3 bg-slate-950 rounded-xl border border-slate-900">
                    <span id="dbLight" class="w-3.5 h-3.5 rounded-full bg-yellow-500 animate-pulse"></span>
                    <span class="text-xs text-slate-400 font-semibold" id="dbText">Database: កំពុងតភ្ជាប់...</span>
                </div>
                <div class="flex items-center gap-3 p-3 bg-slate-950 rounded-xl border border-slate-900">
                    <span id="apiLight" class="w-3.5 h-3.5 rounded-full bg-yellow-500 animate-pulse"></span>
                    <span class="text-xs text-slate-400 font-semibold" id="apiText">Cloud API: កំពុងតភ្ជាប់...</span>
                </div>
                <div class="flex items-center gap-3 p-3 bg-slate-950 rounded-xl border border-slate-900">
                    <span id="accLight" class="w-3.5 h-3.5 rounded-full bg-yellow-500 animate-pulse"></span>
                    <span class="text-xs text-slate-400 font-semibold" id="accText">Exness Account: រង់ចាំការភ្ជាប់...</span>
                </div>
            </div>
        </div>
        
        <!-- ផ្ទាំងចុះឈ្មោះសមាជិកថ្មី (Exness MT5 Connection) -->
        <div class="bg-slate-900/60 border border-slate-900 p-6 rounded-2xl shadow-xl">
            <h2 class="text-lg font-semibold text-slate-300 mb-4 border-b border-slate-800 pb-2">📝 ចុះឈ្មោះគណនីត្រេដថ្មី</h2>
            <div id="regConsole" class="hidden mb-4 p-3 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-xl text-xs"></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">លេខគណនី Exness MT5 (Login ID)</label>
                    <input type="text" id="accId" value="105875038" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-300 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">លេខសម្ងាត់ Exness (Trading Password)</label>
                    <input type="password" id="password_mt5" value="Id168169$" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-300 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">ម៉ាស៊ីនបម្រើ (Broker Server)</label>
                    <input type="text" id="server" value="Exness-MT5Real15" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-300 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Lot Size របស់ខ្លួនឯង</label>
                    <input type="number" id="lotSize" value="0.01" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-300 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2 md:col-span-2">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">កាត់ចំណេញ TP ($)</label>
                        <input type="number" id="tp_usd" value="0.65" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-emerald-400 font-bold focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">កាត់ខាត SL ($)</label>
                        <input type="number" id="sl_usd" value="5.00" step="0.1" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-rose-400 font-bold focus:outline-none">
                    </div>
                </div>
            </div>
            <button id="regBtn" onclick="registerAccount()" class="w-full mt-6 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition-all">🚀 ចុះឈ្មោះ និងតភ្ជាប់ទៅ Cloud</button>
        </div>

        <!-- ផ្ទាំងបង្ហាញសមតុល្យលុយ (Real-time Balance/Equity Panel) -->
        <div class="bg-slate-900/60 border border-slate-900 p-6 rounded-2xl shadow-xl">
            <h2 class="text-lg font-semibold text-slate-300 mb-4 border-b border-slate-800 pb-2">📊 សមតុល្យគណនីបច្ចុប្បន្ន (Balance & Equity)</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="p-4 bg-slate-950 border border-slate-900 rounded-xl">
                    <p class="text-xs text-slate-500">សមតុល្យ (Balance)</p>
                    <h3 id="balVal" class="text-2xl font-bold text-slate-100">$0.00</h3>
                </div>
                <div class="p-4 bg-slate-950 border border-slate-900 rounded-xl">
                    <p class="text-xs text-slate-500">ទ្រព្យសកម្ម (Equity)</p>
                    <h3 id="eqVal" class="text-2xl font-bold text-emerald-400">$0.00</h3>
                </div>
            </div>
        </div>

    </main>

    <script>
        function updateStatusLight(elementId, textId, name, isConnected) {
            const light = document.getElementById(elementId);
            const text = document.getElementById(textId);
            if(isConnected) {
                light.className = "w-3.5 h-3.5 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50";
                text.innerText = `${name}: ជោគជ័យ`;
                text.className = "text-xs text-emerald-400 font-semibold";
            } else {
                light.className = "w-3.5 h-3.5 rounded-full bg-rose-500 shadow-lg shadow-rose-500/50 animate-pulse";
                text.innerText = `${name}: បរាជ័យ`;
                text.className = "text-xs text-rose-500 font-semibold";
            }
        }

        // មុខងារហៅស្កែនរកភ្លើងសញ្ញាទូទៅ (Database & Cloud API) ភ្លាមៗពេលបើកវិបសាយដំបូង
        function fetchGeneralStatus() {
            fetch('/api/status-general')
            .then(res => res.json())
            .then(data => {
                updateStatusLight('dbLight', 'dbText', 'Database', data.db);
                updateStatusLight('apiLight', 'apiText', 'Cloud API', data.api);
            });
        }
        
        fetchGeneralStatus();
        setInterval(fetchGeneralStatus, 5000);

        function registerAccount() {
            const regBtn = document.getElementById('regBtn');
            const regConsole = document.getElementById('regConsole');
            const accLight = document.getElementById('accLight');
            const accText = document.getElementById('accText');
            
            regBtn.innerText = "កំពុងផ្ទៀងផ្ទាត់ និងតភ្ជាប់ទៅ Exness... (សូមរង់ចាំ)";
            regBtn.disabled = true;
            regConsole.classList.remove('hidden');
            regConsole.innerText = "ប្រព័ន្ធកំពុងធ្វើការតភ្ជាប់ទៅកាន់ម៉ាស៊ីនមេ Exness ដើម្បីផ្ទៀងផ្ទាត់គណនីរបស់អ្នក...";
            
            accLight.className = "w-3.5 h-3.5 rounded-full bg-yellow-500 animate-pulse";
            accText.innerText = "Exness Account: កំពុងតភ្ជាប់...";
            accText.className = "text-xs text-yellow-500 font-semibold";

            const accId = document.getElementById('accId').value;
            const password_mt5 = document.getElementById('password_mt5').value;
            const server = document.getElementById('server').value;
            const lotSize = parseFloat(document.getElementById('lotSize').value);
            const tp_usd = parseFloat(document.getElementById('tp_usd').value);
            const sl_usd = parseFloat(document.getElementById('sl_usd').value);

            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accId, password_mt5, server, lotSize, tp_usd, sl_usd })
            })
            .then(res => res.json())
            .then(data => {
                regBtn.innerText = "🚀 ចុះឈ្មោះ និងតភ្ជាប់ទៅ Cloud";
                regBtn.disabled = false;
                if(data.success) {
                    regConsole.className = "mb-4 p-3 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-xl text-xs";
                    regConsole.innerText = data.message;
                    
                    // បង្ហាញសមតុល្យលុយពិតភ្លាមៗ
                    document.getElementById('balVal').innerText = `$${parseFloat(data.balance).toFixed(2)}`;
                    document.getElementById('eqVal').innerText = `$${parseFloat(data.equity).toFixed(2)}`;
                    
                    updateStatusLight('accLight', 'accText', 'Exness Account', true);
                } else {
                    regConsole.className = "mb-4 p-3 bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-xl text-xs";
                    regConsole.innerText = data.message;
                    updateStatusLight('accLight', 'accText', 'Exness Account', false);
                }
            })
            .catch(err => {
                regBtn.innerText = "🚀 ចុះឈ្មោះ និងតភ្ជាប់ទៅ Cloud";
                regBtn.disabled = false;
                regConsole.className = "mb-4 p-3 bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-xl text-xs";
                regConsole.innerText = "កំហុសបច្ចេកទេស៖ ការតភ្ជាប់ទៅកាន់ Server របស់ Render មានបញ្ហា!";
                updateStatusLight('accLight', 'accText', 'Exness Account', false);
            });
        }
    </script>
</body>
</html>
